plugins { id 'com.android.application' }
android {
    namespace 'org.admute'
    compileSdk 35
    defaultConfig {
        applicationId 'org.admute'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            def localTestKey = rootProject.file('.signing/debug.keystore')
            if (localTestKey.exists()) storeFile localTestKey
        }
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
